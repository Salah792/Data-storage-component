<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- page icon  -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <!-- external fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- css files -->
    <link rel="stylesheet" href="./css/main.css" />

    <!-- page title  -->
    <title>Storage Card</title>
  </head>
  <body class="flex justify-center items-center">
    <main>
      <section class="card_container">
        <div class="cards-group card--storage-card flow-content--sm flex">
          <div
            class="card card__header flow-content flex flex-column justify-center items-start"
          >
            <div class="card__brand-container">
              <img src="./images/logo.svg" alt="Company Logo" />
            </div>
            <div class="card_icons-container flex justify-between">
              <div class="card_icon flex justify-center items-center">
                <img
                  src="./images/icon-document.svg"
                  alt="open a new document"
                />
              </div>
              <div class="card_icon flex justify-center items-center">
                <img src="./images/icon-folder.svg" alt="open a new folder" />
              </div>
              <div class="card_icon flex justify-center items-center">
                <img
                  src="./images/icon-upload.svg"
                  alt="upload a new document or folder"
                />
              </div>
            </div>
          </div>
          <div class="card card__content flow-content--sm">
            <p class="card_storage-used">You’ve used 815 GB of your storage</p>
            <div class="progress-bar-group flow-content--mini mb-1">
              <div class="progress-container" style="--progress: 81.5%">
                <progress
                  class="progress-bar"
                  value="815"
                  max="1000"
                  aria-label="Storage progress"
                >
                  81.5%
                </progress>
              </div>
              <div class="flex card_progress-bar-borders justify-between">
                <p>0 GB</p>
                <p>1000 GB</p>
              </div>
            </div>

            <div class="card_space-left flex items-center justify-center">
              <p><span>185</span> GB LEFT</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
